# CI for the Hippocampus Homebrew tap. Two jobs:
#   - syntax: `brew style` + `brew audit` on every push and PR (fast, platform-independent).
#   - install: on PRs only, actually installs + tests each formula on macOS and Linux, catching a
#     bad url/sha or a broken `install`/`test` block that style/audit can't see. It is PR-only so the
#     automated `hippocampus <version>` bump commits (pushed straight to main by the release
#     workflow) run just the cheap syntax check — their hashes come from the release checksums.txt
#     and so are correct by construction.
#
# Homebrew/actions/setup-homebrew auto-taps this checkout (the repo is a homebrew-* tap), registering
# it as fastbean-au/tap against the working tree, so the jobs reference the tap by name directly - a
# manual `brew tap` would conflict with that ("remote mismatch").
#
# The action is pinned to a dated release tag rather than a branch. Homebrew/actions has no `master`
# branch any more - it renamed the default to `main` and started cutting `YYYY.MM.DD.N` tags - so
# the old `@master` reference stopped resolving ("unable to find version `master`") and failed the
# job before a single step ran. A tag also means third-party CI code only moves when Dependabot
# raises the pin in a reviewable PR, which is the point of watching github-actions in
# .github/dependabot.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@2026.09.21.1

      - name: brew style
        run: brew style fastbean-au/tap

      - name: brew audit
        run: brew audit --tap fastbean-au/tap

  install:
    if: github.event_name == 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@2026.09.21.1

      # Install + run each formula's `test do` block (all three are lightweight `--version` checks).
      # This downloads the real release assets the formulae pin, so it verifies the url/sha256 pairs
      # resolve on the runner's OS/arch and the `install` block lays the binary down correctly.
      - name: Install and test the formulae
        run: |
          set -euo pipefail

          for formula in hippocampus hippocampus-cli hippocampus-mcp; do
            brew install --formula "fastbean-au/tap/${formula}"
            brew test "fastbean-au/tap/${formula}"
          done
